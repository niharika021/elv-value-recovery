<text x="450.0" y="540.8" font-size="15" fill="#52514e" text-anchor="middle">named · reasoned</text>
<rect x="640" y="436" width="240" height="130" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="760.0" y="471.8" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">ADK agents</text>
<text x="760.0" y="494.8" font-size="15" fill="#52514e" text-anchor="middle">coordinator →</text>
<text x="760.0" y="517.8" font-size="15" fill="#52514e" text-anchor="middle">inspection · compliance</text>
<text x="760.0" y="540.8" font-size="15" fill="#52514e" text-anchor="middle">grounding check</text>
