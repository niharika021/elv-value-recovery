<text x="130.0" y="73.2" font-size="15" fill="#52514e" text-anchor="middle">20 starter and</text>
<text x="130.0" y="96.2" font-size="15" fill="#52514e" text-anchor="middle">alternator parts (PDF)</text>
<rect x="290" y="20" width="270" height="96" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="425.0" y="50.2" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">Drawing reader · Gemini</text>
<text x="425.0" y="73.2" font-size="15" fill="#52514e" text-anchor="middle">limit + verbatim quote,</text>
<text x="425.0" y="96.2" font-size="15" fill="#52514e" text-anchor="middle">then 5 fixed gates</text>
<rect x="610" y="20" width="270" height="96" rx="10" fill="#f3f2ee" stroke="#a9a79c" stroke-width="1.5"/>
<text x="745.0" y="50.2" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">Vehicle data (CSV)</text>
<text x="745.0" y="73.2" font-size="15" fill="#52514e" text-anchor="middle">vehicles · parts · inspections</text>
<text x="745.0" y="96.2" font-size="15" fill="#52514e" text-anchor="middle">prices · evidence</text>
