<text x="116.0" y="258.0" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle">Grading</text>
<text x="116.0" y="280.0" font-size="14" fill="#52514e" text-anchor="middle">measurement vs</text>
<text x="116.0" y="302.0" font-size="14" fill="#52514e" text-anchor="middle">drawing limit</text>
