<rect x="20" y="436" width="240" height="130" rx="10" fill="#f3f2ee" stroke="#a9a79c" stroke-width="1.5"/>
<text x="140.0" y="471.8" font-size="17" font-weight="600" fill="#0b0b0b" text-anchor="middle">Web app</text>
